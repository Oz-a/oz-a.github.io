<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teaching | Ozan Ahmet Cetin</title>
  <meta name="description" content="Teaching of Ozan Ahmet Cetin" />

  <style>
    :root{
      --text:#111;
      --muted:#666;
      --line:#e8e8e8;
      --bg:#fff;
      --chip:#f6f6f6;
      --link:#0b57d0;
      --shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
      line-height:1.65;
    }
    .wrap{
      max-width:980px;
      margin:48px auto;
      padding:0 20px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:14px 16px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      position:sticky;
      top:14px;
      box-shadow: 0 2px 18px rgba(0,0,0,0.04);
      z-index:10;
    }
    .brand{
      font-weight:650;
      font-size:14px;
      letter-spacing:0.01em;
      white-space:nowrap;
    }
    nav{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:flex-end;
      font-size:14px;
    }
    nav a{
      color:var(--muted);
      text-decoration:none;
      padding:6px 10px;
      border-radius:999px;
    }
    nav a:hover{
      color:var(--text);
      background:var(--chip);
      text-decoration:none;
    }
    .cta{
      color:var(--link);
      border:1px solid var(--line);
      background:#fff;
    }
    .cta:hover{
      border-color:#d6d6d6;
      background:#fafafa;
    }

    .card{
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      box-shadow:var(--shadow);
    }

    header.page{
      margin-top:22px;
      padding:22px 22px;
    }
    h1{
      font-size:28px;
      margin:0 0 6px 0;
      letter-spacing:-0.02em;
      line-height:1.2;
    }
    .sub{
      margin:0;
      color:var(--muted);
      font-size:15px;
      max-width:70ch;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin:18px 0 18px 0;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:9px 12px;
      border:1px solid var(--line);
      border-radius:999px;
      background:var(--chip);
      font-size:13px;
      color:var(--text);
      cursor:pointer;
      user-select:none;
    }
    .chip[aria-pressed="true"]{
      border-color:#cfd8ff;
      background:#eef2ff;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:18px;
      margin-top:18px;
    }
    @media (max-width: 860px){
      .grid{ grid-template-columns: 1fr; }
      .topbar{ position:static; }
    }

    .section{
      padding:20px 20px;
    }
    .section h2{
      margin:0 0 10px 0;
      font-size:16px;
      letter-spacing:-0.01em;
    }
    .muted{ color:var(--muted); }

    .term{
      margin-top:8px;
      margin-bottom:10px;
      font-size:13px;
      letter-spacing:0.08em;
      color:var(--muted);
      text-transform:uppercase;
    }

    .list{
      margin:10px 0 0 0;
      padding:0;
      list-style:none;
      display:grid;
      gap:10px;
    }
    .item{
      padding:12px 12px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
    }
    .item strong{
      display:block;
      font-size:14px;
      margin-bottom:4px;
    }
    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      color:var(--muted);
      font-size:13px;
    }
    .badge{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--line);
      padding:4px 8px;
      border-radius:999px;
      background:#fff;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      font-size:13px;
      text-decoration:none;
      color:var(--link);
    }
    .btn:hover{
      border-color:#d6d6d6;
      background:#fafafa;
    }
    details{
      margin-top:10px;
      padding-left:2px;
    }
    summary{
      cursor:pointer;
      color:var(--link);
      font-size:13px;
      list-style:none;
    }
    summary::-webkit-details-marker{ display:none; }

    footer{
      margin:28px 2px 10px 2px;
      color:var(--muted);
      font-size:13px;
    }
    .rule{
      border:0;
      border-top:1px solid var(--line);
      margin:14px 0;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Ozan Ahmet Cetin</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="publications.html">Publications</a>
        <a href="teaching.html" aria-current="page">Teaching</a>
        <a class="cta" href="cv.pdf">CV</a>
      </nav>
    </div>

    <header class="card page">
      <h1>Teaching</h1>
      <p class="sub">
        Current and planned courses. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.
      </p>

      <div class="controls">
        <button class="chip" type="button">Fall 2025</button>
        <button class="chip" type="button">Spring 2026</button>
        <button class="chip" type="button">Graduate</button>
      </div>
    </header>
